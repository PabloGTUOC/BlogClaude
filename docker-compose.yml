services:
  db:
    image: mysql:8.0
    container_name: enderthoughts-db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
      MYSQL_DATABASE: ${DB_NAME}
      # Least-privilege app user, auto-created WITH FULL GRANTS ON ${DB_NAME}
      # on a FRESH data volume only. For an existing mysql-data volume, create
      # it manually (see SETUP.md / deploy notes).
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_APP_PASS}
    # No published ports: only the api reaches the DB, over the compose network.
    # For host debugging, temporarily add: ports: ["127.0.0.1:3306:3306"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: enderthoughts-api
    restart: unless-stopped
    environment:
      NODE_ENV: production  # hard-disables mock auth regardless of ALLOW_MOCK_AUTH
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_APP_PASS: ${DB_APP_PASS}  # app-user password; root's DB_PASS never enters this container
      JWT_SECRET: ${JWT_SECRET}
      FIREBASE_SERVICE_ACCOUNT_PATH: /app/firebase-service-account.json
      UPLOAD_PATH: /app/uploads
      # Google Photos Picker API (backend OAuth) — required for digital cloud imports
      VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      API_ORIGIN: ${API_ORIGIN}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
    # No published ports: the frontend nginx proxies /api and /uploads to this
    # container over the compose network (single-origin deployment).
    # For host debugging, temporarily add: ports: ["127.0.0.1:3000:3000"]
    depends_on:
      db:
        condition: service_healthy  # wait for MySQL readiness, not just container start
    volumes:
      - ${UPLOAD_PATH}:/app/uploads
      - ${FIREBASE_SERVICE_ACCOUNT_PATH:-/dev/null}:/app/firebase-service-account.json:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # VITE_* values are baked in at build time, so they must be passed as build args
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID}
    container_name: enderthoughts-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  mysql-data:
