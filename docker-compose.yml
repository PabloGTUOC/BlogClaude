version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: enderthoughts-db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: enderthoughts-api
    restart: unless-stopped
    environment:
      NODE_ENV: production  # hard-disables mock auth regardless of ALLOW_MOCK_AUTH
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      JWT_SECRET: ${JWT_SECRET}
      FIREBASE_SERVICE_ACCOUNT_PATH: /app/firebase-service-account.json
      UPLOAD_PATH: /app/uploads
      # Google Photos Picker API (backend OAuth) — required for digital cloud imports
      VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      API_ORIGIN: ${API_ORIGIN}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
    ports:
      - "3000:3000"
    depends_on:
      - db
    volumes:
      - ${UPLOAD_PATH}:/app/uploads
      - ${FIREBASE_SERVICE_ACCOUNT_PATH:-/dev/null}:/app/firebase-service-account.json:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # VITE_* values are baked in at build time, so they must be passed as build args
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID}
    container_name: enderthoughts-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  mysql-data:
