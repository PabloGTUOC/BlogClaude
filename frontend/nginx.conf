server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- Single-origin deployment: /api and /uploads are proxied to the api
    # container over the compose network, so the public site needs only ONE
    # hostname and CORS never comes into play.
    # `^~` is required: without it the regex asset-cache location below would
    # capture /uploads/*.jpg and 404 it from the local docroot.
    # Docker's embedded DNS + a variable proxy_pass make nginx re-resolve the
    # api container on each request, surviving api restarts without a reload.
    resolver 127.0.0.11 valid=30s;
    set $api_upstream http://api:3000;

    location ^~ /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 220m;   # api multer limit is 200MB (videos)
        proxy_request_buffering off; # stream large uploads instead of spooling
        proxy_read_timeout 300s;     # long-running gallery zip downloads
    }

    location ^~ /uploads/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The SPA shell must never go stale: hashed assets below are cached 1y,
    # so index.html is the only pointer to the current bundle.
    # NOTE: add_header inside a location discards inherited headers,
    # so the security headers are repeated wherever add_header is used.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long cache for hashed static assets
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
    }
}
